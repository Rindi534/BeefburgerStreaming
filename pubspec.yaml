name: beefburger_streaming
description: "BeefburgerStreaming — deine lokale Streaming-Plattform für Filme und Serien."
publish_to: 'none'
# Unified version after master ↔ ios-support merge. Master was at
# 1.5.50, ios-support at 1.9.13 — wir nehmen die größere Schiene
# und ziehen Windows mit. +111 als Build-Counter über beiden.
version: 1.9.29+126

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  media_kit_libs_windows_video: ^1.0.10
  # iOS backend for media_kit — used as fallback on iPhone/iPad builds.
  media_kit_libs_ios_video: ^1.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  google_fonts: ^6.2.1
  window_manager: ^0.4.3
  # Borderless-fullscreen path on Windows (query monitor pixel bounds).
  screen_retriever: ^0.2.0
  # Windows 11 DWM APIs via dart:ffi for borderless fullscreen.
  ffi: ^2.1.0
  # iOS-only: native AVAssetImageGenerator wrapper for thumbnails.
  video_thumbnail: ^0.5.3
  # Cross-platform "open file / share" — iOS uses it because
  # Process.start('explorer') is sandbox-forbidden there.
  url_launcher: ^6.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
