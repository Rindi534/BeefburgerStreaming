name: beefburger_streaming
description: "BeefburgerStreaming — deine lokale Streaming-Plattform für Filme und Serien."
publish_to: 'none'
version: 1.8.1+89

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  media_kit_libs_windows_video: ^1.0.10
  # iOS backend for media_kit — used as fallback on iPhone/iPad builds.
  # The native AVPlayer path (see services/ios_native_player_service.dart)
  # is preferred there because it gives us system PiP + AirPlay, but we
  # still link libmpv so any code that opens a media_kit Player (e.g.
  # thumbnail preview generation) keeps working.
  media_kit_libs_ios_video: ^1.1.4
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  google_fonts: ^6.2.1
  window_manager: ^0.4.3
  # iOS-only: native AVAssetImageGenerator wrapper for thumbnails.
  # On Windows we keep using the bundled ffmpeg.exe (no change).
  video_thumbnail: ^0.5.3
  # Cross-platform "open file / share" — replaces the Windows-only
  # Process.start('explorer', ...) call on iOS where shelling out is
  # forbidden by the sandbox.
  url_launcher: ^6.3.0
  # ffmpeg-kit-flutter (community fork, maintained successor of the
  # discontinued ffmpeg_kit_flutter): used to extract embedded
  # subtitle streams from .mkv files into .srt cache files. libvlcs
  # vmem path doesnt composite SPU into our buffer, so we read the
  # subs out of the file directly and render them Dart-side via
  # SubtitleOverlay. Bundle adds ~30 MB to the iOS .ipa for the
  # min-gpl ffmpeg variant — acceptable cost for a feature that
  # otherwise wouldnt work at all on the libvlc backend.
  ffmpeg_kit_flutter_new: ^3.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
