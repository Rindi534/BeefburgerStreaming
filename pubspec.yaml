name: beefburger_streaming
description: "BeefburgerStreaming — deine lokale Streaming-Plattform für Filme und Serien."
publish_to: 'none'
version: 1.5.35+40

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  media_kit: ^1.1.11
  media_kit_video: ^1.2.5
  media_kit_libs_video: ^1.0.5
  media_kit_libs_windows_video: ^1.0.10
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_riverpod: ^2.5.1
  file_picker: ^8.0.0
  path_provider: ^2.1.2
  path: ^1.9.0
  google_fonts: ^6.2.1
  window_manager: ^0.4.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
