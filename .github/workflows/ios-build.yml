# Baut ein unsigned .ipa fuer iPhone/iPad auf GitHubs gehosteten
# macOS-Runnern.
#
# Triggers:
#   - Jeder Push auf master:           Artifact upload (14 Tage Aufbewahrung)
#   - Jeder Push eines Tags "v*.*.*":  Zusaetzlich an GitHub-Release anhaengen
#   - Manueller "Run workflow":        Artifact upload
#
# Ergebnis: artifact "BeefburgerStreaming-unsigned-ipa" -> herunterladen,
# dann mit Sideloadly auf Windows mit freier Apple-ID signieren und aufs
# iPad/iPhone spielen.
#
# Warum "unsigned"? Signing braucht einen bezahlten Apple Developer Account
# (99 USD/Jahr) oder die Apple-ID-Keys vom lokalen Mac. Wir haben weder das
# eine noch das andere, also bauen wir die App roh und lassen Sideloadly
# das Signing mit der freien Apple-ID lokal erledigen.

name: iOS build (unsigned IPA)

on:
  workflow_dispatch:
  push:
    branches: [master]
    tags: ['v*.*.*']

jobs:
  build-ios:
    # macos-14 = Apple Silicon Runner mit Xcode 15/16.
    # Wichtig: macOS-Runner zaehlen auf private Repos 10-fach gegenueber
    # Linux-Minuten; unsere 2000 Free-Minutes werden zu effektiv 200
    # Mac-Minuten. Ein Build dauert ~8-12 min.
    runs-on: macos-14

    permissions:
      contents: write   # noetig fuer Release-Upload bei Tag-Triggern

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.41.7'
          cache: true

      - name: Flutter version info
        run: flutter --version

      - name: Flutter pub get
        run: flutter pub get

      - name: CocoaPods install
        working-directory: ios
        run: pod install --repo-update

      - name: Build unsigned iOS app
        run: flutter build ios --release --no-codesign

      - name: Package Runner.app into IPA
        run: |
          set -e
          cd build/ios/iphoneos
          mkdir -p Payload
          cp -R Runner.app Payload/Runner.app
          zip -r -y ../../../BeefburgerStreaming-unsigned.ipa Payload
          cd -
          ls -lh BeefburgerStreaming-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: BeefburgerStreaming-unsigned-ipa
          path: BeefburgerStreaming-unsigned.ipa
          retention-days: 14

      # ----------------------------------------------------------------
      # Release-Upload nur bei Tag-Push (z.B. "v2.0.0").
      # softprops/action-gh-release erstellt das Release falls noch
      # nicht vorhanden und haengt die .ipa an. iOS- und Windows-Jobs
      # haengen unabhaengig voneinander an, das Release wird einmalig
      # erstellt und beide Anhaenge tauchen daran auf.
      # ----------------------------------------------------------------
      - name: Attach IPA to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: BeefburgerStreaming-unsigned.ipa
          # generate_release_notes erstellt automatisch die Liste der
          # Commits seit dem letzten Release als Release-Beschreibung.
          generate_release_notes: true
